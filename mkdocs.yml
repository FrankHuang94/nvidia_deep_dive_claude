site_name: NVIDIA Full-Stack Deep Dive
site_description: How and why NVIDIA became indispensable in AI training and inference — a visual research repository.
docs_dir: .site_src
site_dir: site
theme:
  name: material
  palette:
    - scheme: default
      primary: green
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: green
      toggle: {icon: material/brightness-4, name: Switch to light mode}
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - github-callouts
plugins:
  - search
not_in_nav: |
  /docs/**
