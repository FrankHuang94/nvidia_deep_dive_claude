name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install validation dependencies
        run: |
          python -m pip install pyyaml
          npm ci
      - name: make validate
        run: make validate
      - name: Chinese translation parity (informational)
        continue-on-error: true
        run: make zh-check
