    <div style="height:620px; width:100%;">                        <script>window.PlotlyConfig = {MathJaxConfig: 'local'};</script>
        <script charset="utf-8" src="https://cdn.plot.ly/plotly-4.1.1.min.js" integrity="sha256-O24V1F27f8pb0glCkelh3cVHLNiHAJ5gCaVtq2aNch8=" crossorigin="anonymous"></script>                <div id="a2710b5b-8c71-41ad-8aaf-3d9518266209" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script>                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("a2710b5b-8c71-41ad-8aaf-3d9518266209")) {                    Plotly.newPlot(                        "a2710b5b-8c71-41ad-8aaf-3d9518266209",                        [{"colorbar":{"title":{"text":"Lock-in"}},"colorscale":[[0,"#F0EFEC"],[0.25,"#CDE2FB"],[0.5,"#86B6EF"],[0.75,"#3987E5"],[1,"#104281"]],"hoverinfo":"text","hovertext":[["\u003cb\u003eFrontier labs \u00b7 Frontier pre-training\u003c\u002fb\u003e\u003cbr\u003eScore 3\u002f5\u003cbr\u003eGoogle trains on TPU; Anthropic runs TPU, Trainium and NVIDIA GPUs; OpenAI adds AMD from H2 2026 - these teams can afford to port\u003cbr\u003eSources: S653;S656;S546","\u003cb\u003eFrontier labs \u00b7 Post-training and fine-tuning\u003c\u002fb\u003e\u003cbr\u003eScore 3\u002f5\u003cbr\u003eRL and post-training reuse the lab's own training and serving stacks, so they follow the pre-training platform choice\u003cbr\u003eSources: S653;S655","\u003cb\u003eFrontier labs \u00b7 Inference: popular models\u003c\u002fb\u003e\u003cbr\u003eScore 2\u002f5\u003cbr\u003eLabs serve their own models on in-house stacks: Anthropic on up to 1M TPUs, OpenAI's Broadcom-built inference ASIC\u003cbr\u003eSources: S653;S625;S628;S174","\u003cb\u003eFrontier labs \u00b7 Inference: new or custom architectures\u003c\u002fb\u003e\u003cbr\u003eScore 3\u002f5\u003cbr\u003eLabs write their own kernels for new architectures, but research prototypes and published kernels (FlashAttention 1-4) land on NVIDIA first\u003cbr\u003eSources: S9000;S9004"],["\u003cb\u003eHyperscalers (own workloads) \u00b7 Frontier pre-training\u003c\u002fb\u003e\u003cbr\u003eScore 3\u002f5\u003cbr\u003eTPU and Trainium train frontier models; Maia and MTIA are mostly inference; hyperscalers still buy NVIDIA for cloud tenants\u003cbr\u003eSources: S656;S561;S90044","\u003cb\u003eHyperscalers (own workloads) \u00b7 Post-training and fine-tuning\u003c\u002fb\u003e\u003cbr\u003eScore 3\u002f5\u003cbr\u003eSame in-house stacks (XLA, Neuron, PyTorch-native MTIA) as pre-training\u003cbr\u003eSources: S9014;S9028","\u003cb\u003eHyperscalers (own workloads) \u00b7 Inference: popular models\u003c\u002fb\u003e\u003cbr\u003eScore 2\u002f5\u003cbr\u003eMaia 200 runs Copilot; MTIA 300 in production; TPU inference cost-competitive with B200 on some workloads\u003cbr\u003eSources: S90044;S561;S625","\u003cb\u003eHyperscalers (own workloads) \u00b7 Inference: new or custom architectures\u003c\u002fb\u003e\u003cbr\u003eScore 4\u002f5\u003cbr\u003eEach new architecture needs compiler and kernel work on custom silicon before it runs well; CUDA paths exist on day 0\u003cbr\u003eSources: S9028;S633"],["\u003cb\u003eChinese labs (export-constrained) \u00b7 Frontier pre-training\u003c\u002fb\u003e\u003cbr\u003eScore 3\u002f5\u003cbr\u003eDeepSeek-V3 trained on 2,048 H800s with PTX-level tuning, but export controls push new capacity to Huawei Ascend\u003cbr\u003eSources: S34007;S5005;S164","\u003cb\u003eChinese labs (export-constrained) \u00b7 Post-training and fine-tuning\u003c\u002fb\u003e\u003cbr\u003eScore 3\u002f5\u003cbr\u003eDeepEP and DeepGEMM now ship Ascend versions with the same APIs\u003cbr\u003eSources: S9009;S9010","\u003cb\u003eChinese labs (export-constrained) \u00b7 Inference: popular models\u003c\u002fb\u003e\u003cbr\u003eScore 2\u002f5\u003cbr\u003eDeepSeek-V4 had day-0 Ascend inference support and was co-designed in part for Ascend\u003cbr\u003eSources: S633","\u003cb\u003eChinese labs (export-constrained) \u00b7 Inference: new or custom architectures\u003c\u002fb\u003e\u003cbr\u003eScore 2\u002f5\u003cbr\u003eTileLang (used for DeepSeek kernels) added an official Ascend 950 backend in Sept 2026\u003cbr\u003eSources: S9011;S633"],["\u003cb\u003eSovereign AI programs \u00b7 Frontier pre-training\u003c\u002fb\u003e\u003cbr\u003eScore 4\u002f5\u003cbr\u003eSovereign buyers mostly purchase turnkey NVIDIA systems (\u003e$30B sovereign revenue in FY2026) and have small kernel teams\u003cbr\u003eSources: S90071","\u003cb\u003eSovereign AI programs \u00b7 Post-training and fine-tuning\u003c\u002fb\u003e\u003cbr\u003eScore 4\u002f5\u003cbr\u003eFine-tuning toolchains (Megatron-LM, NeMo) are NVIDIA-native; ROCm forks exist but lag\u003cbr\u003eSources: S590;S591","\u003cb\u003eSovereign AI programs \u00b7 Inference: popular models\u003c\u002fb\u003e\u003cbr\u003eScore 3\u002f5\u003cbr\u003evLLM and SGLang are native on ROCm, and Huawei and AMD bid for national clouds\u003cbr\u003eSources: S580;S582","\u003cb\u003eSovereign AI programs \u00b7 Inference: new or custom architectures\u003c\u002fb\u003e\u003cbr\u003eScore 4\u002f5\u003cbr\u003eNew models run on CUDA on day 0; other stacks need days to weeks\u003cbr\u003eSources: S633;S631"],["\u003cb\u003eAI startups and neoclouds \u00b7 Frontier pre-training\u003c\u002fb\u003e\u003cbr\u003eScore 4\u002f5\u003cbr\u003eNeocloud fleets are overwhelmingly NVIDIA; startups lack engineers to port training stacks\u003cbr\u003eSources: S90071","\u003cb\u003eAI startups and neoclouds \u00b7 Post-training and fine-tuning\u003c\u002fb\u003e\u003cbr\u003eScore 4\u002f5\u003cbr\u003eOpen-source fine-tuning stacks are CUDA-first; ROCm support level 2 in Megatron-LM and DeepSpeed\u003cbr\u003eSources: S583;S591","\u003cb\u003eAI startups and neoclouds \u00b7 Inference: popular models\u003c\u002fb\u003e\u003cbr\u003eScore 3\u002f5\u003cbr\u003eMI355X was up to 29.6% cheaper per token than B200 on GLM-5 FP8, but NVIDIA was up to 5x cheaper on agentic GLM 5.3 at 150 tok\u002fs\u002fuser\u003cbr\u003eSources: S637;S636","\u003cb\u003eAI startups and neoclouds \u00b7 Inference: new or custom architectures\u003c\u002fb\u003e\u003cbr\u003eScore 4\u002f5\u003cbr\u003eROCm needed 8 days for FP4 and 27 days to serve DeepSeek-V4-Pro at 50 tok\u002fs\u002fuser\u003cbr\u003eSources: S631"],["\u003cb\u003eEnterprises (self-hosted) \u00b7 Frontier pre-training\u003c\u002fb\u003e\u003cbr\u003eScore 5\u002f5\u003cbr\u003eRare; when it happens it uses NVIDIA systems sold through OEMs with NVIDIA software\u003cbr\u003eSources: S587","\u003cb\u003eEnterprises (self-hosted) \u00b7 Post-training and fine-tuning\u003c\u002fb\u003e\u003cbr\u003eScore 5\u002f5\u003cbr\u003eFew in-house GPU engineers; tooling, tutorials and support assume CUDA\u003cbr\u003eSources: S587;S590","\u003cb\u003eEnterprises (self-hosted) \u00b7 Inference: popular models\u003c\u002fb\u003e\u003cbr\u003eScore 3\u002f5\u003cbr\u003ePortable via vLLM and ONNX Runtime, and API consumption hides the hardware entirely\u003cbr\u003eSources: S580;S585","\u003cb\u003eEnterprises (self-hosted) \u00b7 Inference: new or custom architectures\u003c\u002fb\u003e\u003cbr\u003eScore 5\u002f5\u003cbr\u003eCustom and multimodal models depend on CUDA-only libraries in the long tail\u003cbr\u003eSources: S627"],["\u003cb\u003eAcademia and research \u00b7 Frontier pre-training\u003c\u002fb\u003e\u003cbr\u003eScore 5\u002f5\u003cbr\u003eUniversity clusters and teaching are CUDA-based; research code assumes CUDA\u003cbr\u003eSources: S9027;S9016","\u003cb\u003eAcademia and research \u00b7 Post-training and fine-tuning\u003c\u002fb\u003e\u003cbr\u003eScore 5\u002f5\u003cbr\u003eResearch code (e.g. RL libraries) is written and tested on NVIDIA GPUs first\u003cbr\u003eSources: S9016","\u003cb\u003eAcademia and research \u00b7 Inference: popular models\u003c\u002fb\u003e\u003cbr\u003eScore 4\u002f5\u003cbr\u003ellama.cpp and vLLM make inference portable, but labs run on NVIDIA\u003cbr\u003eSources: S579;S580","\u003cb\u003eAcademia and research \u00b7 Inference: new or custom architectures\u003c\u002fb\u003e\u003cbr\u003eScore 5\u002f5\u003cbr\u003eNew attention kernels and benchmarks (FlashAttention, KernelBench) appear on CUDA first\u003cbr\u003eSources: S9000;S9016"]],"text":[[3,3,2,3],[3,3,2,4],[3,3,2,2],[4,4,3,4],[4,4,3,4],[5,5,3,5],[5,5,4,5]],"texttemplate":"%{text}","x":["Frontier pre-training","Post-training and fine-tuning","Inference: popular models","Inference: new or custom architectures"],"xgap":3,"y":["Frontier labs","Hyperscalers (own workloads)","Chinese labs (export-constrained)","Sovereign AI programs","AI startups and neoclouds","Enterprises (self-hosted)","Academia and research"],"ygap":3,"z":[[3,3,2,3],[3,3,2,4],[3,3,2,2],[4,4,3,4],[4,4,3,4],[5,5,3,5],[5,5,4,5]],"zmax":5,"zmin":1,"type":"heatmap"}],                        {"template":{"data":{"barpolar":[{"marker":{"line":{"color":"white","width":0.5},"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"barpolar"}],"bar":[{"error_x":{"color":"#2a3f5f"},"error_y":{"color":"#2a3f5f"},"marker":{"line":{"color":"white","width":0.5},"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"bar"}],"carpet":[{"aaxis":{"endlinecolor":"#2a3f5f","gridcolor":"#C8D4E3","linecolor":"#C8D4E3","minorgridcolor":"#C8D4E3","startlinecolor":"#2a3f5f"},"baxis":{"endlinecolor":"#2a3f5f","gridcolor":"#C8D4E3","linecolor":"#C8D4E3","minorgridcolor":"#C8D4E3","startlinecolor":"#2a3f5f"},"type":"carpet"}],"choropleth":[{"colorbar":{"outlinewidth":0,"ticks":""},"type":"choropleth"}],"contourcarpet":[{"colorbar":{"outlinewidth":0,"ticks":""},"type":"contourcarpet"}],"contour":[{"colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]],"type":"contour"}],"heatmap":[{"colorbar":{"outlinewidth":0,"ticks":""},"colorscal
